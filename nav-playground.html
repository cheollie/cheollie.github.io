<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>navigation playground · cheollie</title>
  <link rel="stylesheet" href="nav-playground.css">
</head>
<body>
  <iframe id="preview" src="/" title="Live site navigation preview"></iframe>
  <aside class="controls" aria-label="Navigation playground">
    <div class="panel-heading"><h1>customize</h1><button id="collapse" aria-expanded="true" aria-controls="settings">hide</button></div>
    <div id="settings">
      <label class="position-label" for="page-choice">preview page
        <select id="page-choice">
          <option value="/">home</option>
          <option value="/about">about</option>
          <option value="/about#employment">about · employment timeline</option>
          <option value="/projects/">projects</option>
          <option value="/blog">blog</option>
        </select>
      </label>
      <div class="presets" role="group" aria-label="Navigation style">
        <button data-mode="side" aria-pressed="false"><span class="diagram side" aria-hidden="true"></span>side index</button>
        <button data-mode="bare" aria-pressed="true"><span class="diagram bare" aria-hidden="true"></span>corner links</button>
        <button data-mode="float" aria-pressed="false"><span class="diagram float" aria-hidden="true"></span>floating center</button>
        <button data-mode="center" aria-pressed="false"><span class="diagram bare" aria-hidden="true"></span>center links</button>
      </div>
      <label class="position-label name-label" for="name-choice">name in navigation
        <select id="name-choice">
          <option value="chelsea-w">chelsea w</option>
          <option value="chelsea">chelsea</option>
          <option value="chelsea-w-flower">🌻 · chelsea w</option>
          <option value="cw">cw</option>
          <option value="sunflower">🌻</option>
          <option value="none">no name</option>
          <option value="original">original sunflower :: cheollie</option>
        </select>
      </label>
      <fieldset id="side-spacing" hidden><legend>sidebar spacing</legend>
        <label class="range-label" for="side-top">top inset <output id="side-top-value">42px</output></label><input id="side-top" type="range" min="0" max="180" value="42">
        <label class="range-label" for="side-name-gap">space below name <output id="side-name-gap-value">58px</output></label><input id="side-name-gap" type="range" min="0" max="160" value="58">
        <label class="range-label" for="side-link-gap">space between links <output id="side-link-gap-value">16px</output></label><input id="side-link-gap" type="range" min="0" max="64" value="16">
      </fieldset>
      <div id="brand-spacing" hidden><label class="range-label" for="brand-gap">sunflower / name spacing <output id="brand-gap-value">20px</output></label><input id="brand-gap" type="range" min="4" max="40" value="20"></div>
      <label class="position-label" id="alignment-label" for="links-alignment" hidden>links without a name
        <select id="links-alignment">
          <option value="right">right / corner</option>
          <option value="center">centered</option>
        </select>
      </label>
      <label class="position-label" id="divider-label" for="name-divider" hidden>name divider
        <select id="name-divider"><option value="none">none</option><option value="line">|</option></select>
      </label>
      <label class="position-label" for="nav-background">navbar background
        <select id="nav-background">
          <option value="white">soft white</option>
          <option value="cream">cream</option>
          <option value="sage">pale sage</option>
          <option value="custom">custom color</option>
          <option value="gradient">original gradient</option>
        </select>
      </label>
      <label class="position-label" id="custom-nav-label" hidden for="nav-color">custom navbar color <input id="nav-color" type="color" value="#fffdf7"></label>
      <label class="range-label" for="tint">navbar opacity <output id="tint-value">0%</output></label>
      <input id="tint" type="range" min="0" max="100" value="0">
      <label class="position-label" id="position-label" hidden>floating position <select id="position"><option value="top">top center</option><option value="bottom">bottom center</option></select></label>
      <label class="position-label" for="page-background">page background
        <select id="page-background">
          <option value="white">white</option>
          <option value="wash">color wash</option>
        </select>
      </label>
      <div class="panel-footer"><button id="original" aria-pressed="false">compare original</button><a href="/" target="_blank" rel="noopener">open current site</a></div>
    </div>
  </aside>
  <script src="nav-playground.js"></script>
</body>
</html>
